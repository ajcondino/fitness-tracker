allowBuilds:
  '@firebase/util': true
  '@sentry/cli': true
  protobufjs: true

# react-native-ble-plx's bundled Expo config plugin imports '@expo/config-plugins'
# directly but doesn't declare it as a dependency (known upstream bug, still present
# in 3.5.1). pnpm's strict node_modules isolation means that import fails to resolve
# unless we tell pnpm to treat it as a real dependency of the package. Without this,
# `expo prebuild` throws "Cannot find module '@expo/config-plugins'" from
# node_modules/react-native-ble-plx/plugin/build/withBLE.js.
packageExtensions:
  react-native-ble-plx:
    dependencies:
      '@expo/config-plugins': '*'
